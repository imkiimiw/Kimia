# Wanger Media large-file relay: the relay, a local Telegram Bot API server and Caddy for HTTPS.
# Secrets come from .env (never commit it): see .env.example and README.md.
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_API_URL: http://bot-api:8081
      WORK_DIR: /data/work
      MAX_MB: ${MAX_MB:-2000}
    volumes:
      - data:/data
    depends_on: [bot-api]
  bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [relay]
volumes:
  data:
  caddy:
