# Wanger News sources. Adding a source never needs a code change: add an entry, run
#   python -m wanger_news check-sources --source <id>
# and set `active: true` only after the live check passes. The latest live check is recorded in
# docs/SOURCES_CHECK.md.
#
# Fields: id, name, domain, country (ISO alpha-2 or INT), language, category (config/categories.yaml),
# source_type, transport (rss | telegram_channel | api | scrape), reliability_score (0-100),
# active, inactive_reason, rss_url, api_config, scraping_config, telegram, rate_limit, priority,
# owner_group (sources with the same owner_group are NOT independent confirmations), notes.
#
# reliability_score values are INITIAL estimates for the owner to review; from Phase 5 the system
# only *suggests* changes (with history), a human applies them.
# Strings may use ${VAR} or ${VAR:-default}; the value comes from the environment or .env.
version: 1
sources:
  # ---------------------------------------------------------------- Telegram source channel
  # Posts in this channel (the bot must be an admin there) are copied to the target channel
  # unless the same post was published before (same message, same forwarded original, same media,
  # same link or the same/near-identical text). Duplicates are reported to the owner instead.
  - id: source-channel
    name: کانال منبع
    country: INT
    language: fa
    category: world
    source_type: social_official_account
    transport: telegram_channel
    telegram:
      chat: ${WANGER_NEWS_SOURCE_CHANNEL}
    reliability_score: 70
    priority: 80
    owner_group: wanger
    notes: Human-curated by the channel admins; treated as already reviewed (no AI, no review gate).

