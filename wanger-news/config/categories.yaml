      en: [dies, died, dead at, death of, passed away, obituary, killed]
      fa: [درگذشت, فوت, جان باخت, کشته شد, مرگ]
  - id: coup
    name_fa: کودتا
    keywords:
      en: [coup, junta, overthrow*, putsch]
      fa: [کودتا, براندازی, سرنگونی]
  - id: election
    name_fa: انتخابات
