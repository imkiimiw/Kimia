# Rule-based classification (Phase 1). No AI: keyword matches, explainable and editable.
#
# Matching is on normalized text (Arabic/Persian letters unified, digits unified, ZWNJ = space,
# case-insensitive) and on whole words. A trailing `*` matches word endings: `elect*` matches
# "election", "elected". Score = title_weight × matches in the title + body_weight × matches in the
# body (config/pipeline.yaml → classification). The highest score wins; below min_category_score
# the source's own category is used.
version: 1
default_priority: 50

categories:
  - id: world
    name_fa: جهان
    name_en: World
    hashtag: جهان
    keywords:
      en: [united nations, foreign minister, diplomat*, summit, refugee*, embassy, border, treaty]
      fa: [سازمان ملل, وزیر خارجه, دیپلمات, نشست سران, پناهجو, سفارت, مرز, پیمان]
  - id: iran
    name_fa: ایران
    name_en: Iran
    hashtag: ایران
    base_priority: 60
    keywords:
      en: [iran, iranian, tehran, isfahan, mashhad, tabriz, shiraz, irgc, rial]
      fa: [ایران, ایرانی, تهران, اصفهان, مشهد, تبریز, شیراز, سپاه, ریال, تومان]
  - id: politics
    name_fa: سیاست
    name_en: Politics
    hashtag: سیاست
    keywords:
      en: [parliament, senate, congress, lawmaker*, minister, government, opposition, political party, vote*, legislation, cabinet]
      fa: [مجلس, سنا, کنگره, نماینده, وزیر, دولت, اپوزیسیون, حزب, رای, لایحه, کابینه]
  - id: economy
