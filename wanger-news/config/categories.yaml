# Priority tiers (spec §6): 100 urgent international crisis, 80 important political/economic,
# 50 normal (default_priority), 20 low. The highest matching rule wins; with no match the
# category's base_priority (if any) or default_priority is used.
priority_rules:
  - priority: 100
    label: international_crisis
    keywords:
      en: [earthquake, tsunami, declares war, declaration of war, nuclear test, nuclear attack, coup, mass casualt*, state of emergency, invasion, invades]
      fa: [زلزله, زمین لرزه, سونامی, اعلام جنگ, آزمایش هسته ای, حمله هسته ای, کودتا, تلفات گسترده, وضعیت اضطراری, تهاجم]
  - priority: 80
    label: major_politics_economy
    keywords:
      en: [election*, sanction*, central bank, interest rate*, ceasefire, peace talks, prime minister, president, resign*, impeach*, oil price*, opec, recession]
      fa: [انتخابات, تحریم, بانک مرکزی, نرخ بهره, آتش بس, مذاکرات صلح, نخست وزیر, رئیس جمهور, استعفا, استیضاح, قیمت نفت, اوپک, رکود]
  - priority: 20
    label: low_interest
    keywords:
      en: [horoscope, recipe*, quiz, crossword, gossip, red carpet, puzzle*]
      fa: [فال, طالع بینی, دستور پخت, سرگرمی, جدول کلمات]

# Topics that ALWAYS go to human review (spec §11), however confident the system is.
# Over-matching is the safe direction here: a false positive only waits for a human.
sensitive_topics:
  - id: war
    name_fa: جنگ
    keywords:
      en: [war, wars, warfare, airstrike*, air strike*, strike*, missile*, rocket*, drone attack*,
           invasion, invades, bombard*, shelling, offensive, frontline, troops, army, armed forces,
           military operation*, ground operation*, ceasefire, genocide, idf, hamas, hezbollah,
           houthi*, militia*, insurgen*]
      fa: [جنگ, حمله هوایی, حمله موشکی, موشک, پهپاد, تهاجم, بمباران, گلوله باران, خط مقدم, ارتش,
           نیروهای نظامی, عملیات نظامی, عملیات زمینی, آتش بس, نسل کشی, حماس, حزب الله, حوثی]
  - id: celebrity_death
    name_fa: مرگ افراد مشهور
