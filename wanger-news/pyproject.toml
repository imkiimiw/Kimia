[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wanger-news"
version = "0.5.0"
description = "Wanger News: news intelligence & publishing platform (Telegram first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "SQLAlchemy[asyncio]>=2.0.30,<2.2",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1.18,<4",
    "aiosqlite>=0.20,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
wanger-news = "wanger_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wanger_news.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs a PostgreSQL server (WANGER_NEWS_TEST_POSTGRES_URL); skipped otherwise",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # schema reflection (the migration drift test) does not know pgvector's type: expected
    "ignore:Did not recognize type 'vector':sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Persian text and ZWNJ are intentional
    "S101",                        # assert documents invariants (mypy narrowing)
    "N818",                        # exception names say what happened (TelegramNotSent)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501"]
"migrations/**" = ["N", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["wanger_news"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true
