[project]
name = "wanger-converter-worker"
version = "0.4.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S311", "S108", "UP007", "UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"app/i18n.py" = ["E501"]
"app/queue.py" = ["S608"]  # placeholders are built from constant tuples, never from input

[tool.pytest.ini_options]
testpaths = ["tests"]
