<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aegis</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- The captcha for a join request, when Aegis is the chat's guard bot. Every text comes from the joinGuard endpoint. -->
  <main id="app" hidden>
    <h1 id="title"></h1>
    <p id="question" class="big"></p>
    <p id="hint" class="muted"></p>
    <div id="options" class="options"></div>
    <p id="result" class="muted"></p>
    <button id="b-close" type="button" class="plain" hidden></button>
  </main>
  <p id="loading" class="center">⏳</p>
  <script src="join.js"></script>
</body>
</html>
