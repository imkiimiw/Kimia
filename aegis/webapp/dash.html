<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aegis</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dash.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="dash">
  <!-- A group's statistics dashboard (opened from 📊 Statistics in the panel: dash?c=<chat id>).
       Every text and number comes from the dash endpoint, which checks the admin live. -->
  <main id="app" class="viz-root" hidden>
    <h1 id="title"></h1>
    <p id="note" class="muted"></p>
    <section class="tiles" id="tiles"></section>
    <section class="card"><h2 id="h-messages"></h2><div class="chart" id="c-messages"></div></section>
    <section class="card"><h2 id="h-active"></h2><div class="chart" id="c-active"></div></section>
    <section class="card"><h2 id="h-members"></h2><div class="legend" id="l-members"></div><div class="chart" id="c-members"></div></section>
    <section class="card"><h2 id="h-hours"></h2><div class="chart" id="c-hours"></div></section>
    <section class="card"><h2 id="h-top"></h2><div class="hbars" id="c-top"></div></section>
    <section class="card"><h2 id="h-punish"></h2><div class="hbars" id="c-punish"></div></section>
    <details class="card"><summary id="h-table"></summary><div class="table-wrap"><table id="t-days"></table></div></details>
    <button id="b-close" type="button" class="plain"></button>
  </main>
  <div id="tip" class="tip" role="status" hidden></div>
  <p id="loading" class="center">⏳</p>
  <p id="error" class="center muted" hidden></p>
  <script src="dash.js"></script>
</body>
</html>
