name: CI

# Local checks only (the bot itself runs on Telegram Serverless, never here).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloud:local

  relay_bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay_bot/package-lock.json
      - run: npm ci
      - run: npm test
