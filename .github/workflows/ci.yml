name: CI

# Local checks only (the bot itself runs on Telegram Serverless, never here).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloud:local

  relay_bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay_bot/package-lock.json
      - run: npm ci
      - run: npm test

  wanger_music:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wanger-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wanger-music/package-lock.json
      - run: npm ci
      - run: npm test
      # Phase 8: every full scan of a growing table must be on the reviewed list
      - run: npm run query-review

  wanger_converter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bots/converter/package-lock.json
      - run: npm ci
      # unit + e2e (SDK emulation on node:sqlite, fake Telegram), incl. the query-plan and module guards
      - run: npm test

  wanger_converter_worker:
    # the optional Python worker (bots/converter/worker): lint, tests, dependency audit, image build + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/converter/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bots/converter/worker/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt
      - name: Docker image (runtime) + smoke test
        run: |
          docker build --target runtime -t wanger-converter-worker:ci .
          docker run -d --name w -p 8080:8080 --read-only --tmpfs /tmp/wanger --cap-drop ALL \
            -e BOT_TOKEN=1:ci-token-not-real-aaaaaaaaaaaaaaaaaaaaaaaaaaaa -e WORKER_SECRET=$(openssl rand -hex 32) \
            wanger-converter-worker:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/readyz
          test "$(docker exec w id -u)" = "10001"
          docker rm -f w

