name: Wanger Music tick

# Fallback scheduler for Wanger Music (wanger-music/). Telegram Serverless has no cron, so this
# runs the DEPLOYED code's endpoints/opsTick every 30 minutes: it pulls the modules that are live in
# the cloud (not the checkout) and executes the tick with `tgcloud run`. Broadcast batches (and,
# from Phase 6, scheduled posts and retries) also run on normal traffic and on the owner's buttons;
# this only guarantees progress when the bot is quiet. Public repository → Actions minutes are free.
# Does nothing until the repository secret WANGER_MUSIC_TGCLOUD_TOKEN (the CLI access token) exists.
# Phase 8: it also passes `tgcloud webhook` to the tick (webhook monitoring) and fails when the tick
# fails, so a broken bot shows up as a failed workflow (GitHub e-mails the repository owner).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: wanger-music-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TGCLOUD_TOKEN: ${{ secrets.WANGER_MUSIC_TGCLOUD_TOKEN }}
    steps:
      - name: Skip until the secret exists
        id: gate
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "WANGER_MUSIC_TGCLOUD_TOKEN is not set: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wanger-music/package-lock.json
      - if: steps.gate.outputs.run == 'true'
        name: Install the tgcloud CLI
        working-directory: wanger-music
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: Use the deployed modules, not the checkout
        working-directory: wanger-music
        run: |
          rm -rf tgcloud .tgcloud
          mkdir .tgcloud
          npx tgcloud pull --force
      - if: steps.gate.outputs.run == 'true'
        name: Run the tick (with the webhook state the CLI sees)
        working-directory: wanger-music
        run: |
          # Phase 8 monitoring: the bot can't read its own webhook here, the CLI can; the tick warns
          # the owner about an out-of-sync webhook, a long queue or a recent webhook error.
          ARGS=$(npx tgcloud --no-pager webhook 2>&1 | node scripts/webhook-state.mjs)
          npx tgcloud run endpoints/opsTick "$ARGS" --ctx '{ initData: { user: { id: 5557901897 } } }' | tee tick.log
          # a failed tick fails this run, so GitHub notifies the repository owner even if the bot can't
          grep -q '{ok:true' tick.log
